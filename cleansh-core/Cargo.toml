# cleansh-core/Cargo.toml
[package]
name = "cleansh-core"
version = "0.1.6"
edition = "2021"
authors = ["Relay"]
license = "MIT OR Apache-2.0"
description = "Core library for CleanSH, providing essential data sanitization rules, compilation, and application logic independent of the CLI."
repository = "https://github.com/KarmaYama/cleansh-workspace"
homepage = "https://github.com/KarmaYama/cleansh-workspace"
keywords = ["sanitization", "redaction", "data-security", "privacy", "core-logic"]
categories = ["data-structures", "parsing", "text-processing"]

[dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" 
serde_yml = "0.0.12"
regex = "1.12"
lazy_static = "1.4"
strip-ansi-escapes = "0.2.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
once_cell = "1.21"
tinytemplate = "1.2"
dirs = "6.0" 
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.22", features = ["serde", "v4"] } 
bincode = { version = "2.0", features = ["serde"] }

# FIX: Switch reqwest to use 'rustls'
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# AWS SDK Dependencies (Required for S3Vault)
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["rt-tokio", "rustls"] }

# Internal crate dependency
cleansh-entropy = { version = "0.1.4", path = "../cleansh-entropy" }
tokio = { version = "1.50.0", features = ["full"] }
async-trait = "0.1.89"

[dev-dependencies]
test-log = "0.2.14" 
tempfile = "3.27"